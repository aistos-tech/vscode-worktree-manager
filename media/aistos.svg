<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Activity bar icons are recoloured by the theme, so this is a single-colour silhouette in
       currentColor with no fills of its own. Stroke-based rather than a filled glyph: at 24px a
       filled letterform loses its counter, while two strokes and a bar stay legible. -->
  <g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 20 12 4l7.5 16"/>
    <path d="M7.7 13.6h8.6"/>
  </g>
</svg>
